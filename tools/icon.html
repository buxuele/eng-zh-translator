<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: transparent; }
      .icon {
        width: 128px; height: 128px;
        background: linear-gradient(150deg, #ff3d90 0%, #fc0377 46%, #c5025d 100%);
        border-radius: 30px;
        display: grid; place-items: center;
        position: relative;
        box-shadow: inset 0 -8px 18px rgba(0, 0, 0, 0.16);
      }
      .glyph {
        color: #fff;
        font: 700 74px/1 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        transform: translateY(-3px);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.22);
      }
      .spark {
        position: absolute; left: 22px; bottom: 20px;
        width: 56px; height: 8px; border-radius: 4px;
        background: #9adb37;
        box-shadow: 0 0 0 0 rgba(154, 219, 55, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <span class="glyph">译</span>
      <span class="spark"></span>
    </div>
  </body>
</html>
